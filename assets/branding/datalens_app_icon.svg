<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>DataLens app icon</title>
  <desc>A white lens ring framing three ascending cyan data bars on a deep indigo background.</desc>
  <defs>
    <linearGradient id="left-bar" x1="392" y1="454" x2="392" y2="837" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#92FAFC"/>
      <stop offset="1" stop-color="#18ADC5"/>
    </linearGradient>
    <linearGradient id="center-bar" x1="512" y1="360" x2="512" y2="837" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#92FAFC"/>
      <stop offset="1" stop-color="#18ADC5"/>
    </linearGradient>
    <linearGradient id="right-bar" x1="632" y1="512" x2="632" y2="837" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#92FAFC"/>
      <stop offset="1" stop-color="#18ADC5"/>
    </linearGradient>
    <clipPath id="lens-boundary">
      <circle cx="512" cy="512" r="325"/>
    </clipPath>
    <mask id="ring-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <rect x="346" y="700" width="332" height="200" fill="#000000"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="#201655"/>
  <circle cx="512" cy="512" r="298" stroke="#FFFFFF" stroke-width="54" mask="url(#ring-cutout)"/>

  <g clip-path="url(#lens-boundary)">
    <path d="M346 900V500A46 46 0 0 1 438 500V900Z" fill="url(#left-bar)"/>
    <path d="M466 900V406A46 46 0 0 1 558 406V900Z" fill="url(#center-bar)"/>
    <path d="M586 900V558A46 46 0 0 1 678 558V900Z" fill="url(#right-bar)"/>
  </g>
</svg>
